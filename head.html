<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* Base styles the Claude artifact viewer normally provides, so the standalone build renders the same. */
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; font-family: system-ui, -apple-system, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button, input, select, label { touch-action: manipulation; }
/* Installed app: the status bar text is always white, so keep the strip behind it dark. */
@media (display-mode: standalone) {
  html { overscroll-behavior-y: none; }
  body::before { background: #0E1115 !important; }
  /* iOS can stop fixed elements short of the screen bottom. Paint the tab bar's
     color below it so there's no darker strip around the home indicator. */
  nav.tabs::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 160px; background: inherit; }
  /* When that gap exists it already clears the home indicator, so drop the extra padding. */
  html.vgap nav.tabs { padding-bottom: 0 !important; }
}
</style>
<script>

   security in supabase/schema.sql keeps each account's rows private. */

(function () {
  var standalone = window.navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  if (!standalone) return;
  function fit() { var gap = (screen.height || 0) - window.innerHeight; document.documentElement.classList.toggle("vgap", gap > 20 && gap < 120); }
  fit(); window.addEventListener("resize", fit); window.addEventListener("orientationchange", function () { setTimeout(fit, 300); });
})();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
